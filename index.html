<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>🩵굴따🩵</title>
<meta name="description" content="아치 아래 야영지 그림. 모닥불, 침대, 밤하늘, 물웅덩이를 누르면 그 자리에서 작은 애니메이션이 재생됩니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=EB+Garamond:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon/android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=20260830-21">
</head>
<body>

  <div class="intro-veil" id="introVeil" role="button" tabindex="0" aria-label="눌러서 입장하기">
    <p class="intro-veil-prompt" id="introPrompt">눌러서 입장하기</p>
    <p class="intro-veil-text">굴따 진입 중&hellip;</p>
  </div>

  <button id="bgmTrackToggle" class="bgm-track-toggle" aria-label="배경음악: Firelight 트랙 선택됨 (누르면 Half-Asleep 트랙으로 전환)">
    <span class="bgm-track-label" id="bgmTrackLabel">Firelight</span>
  </button>
  <button id="bgmToggle" class="bgm-toggle" aria-pressed="false" aria-label="배경음악 재생">
    <span class="bgm-icon">♪</span>
  </button>
  <audio id="bgmAudio" src="assets/bgm.mp3" loop preload="auto"></audio>

  <main class="stage">
    <div class="scene-frame" id="sceneFrame">
    <div class="scene" id="scene">
      <img class="scene-img" id="sceneImg" src="assets/scene.png" alt="돌 아치 아래, 강이 내려다보이는 야영지 — 모닥불과 캠핑 침대, 그 옆에 앉아있는 강아지 쿤이가 있는 밤 풍경" width="941" height="1672">

      <!-- static figure layer: positioned to match the source PSD's
           layer bbox exactly (561,930)-(798,1198) on the 941x1672
           canvas, converted to percentages. Sits above the base
           scene-img but below the fire-glow/ambient-flicker overlays
           below so the firelight still visually washes over her. Not
           baked into scene.png (unlike the dog/basket) so her position
           stays easy to nudge later without touching the master
           background asset. -->
      <div class="scene-figure" id="figureWoman" role="button" tabindex="0" aria-label="침대에 걸터앉다" style="left:59.617%; top:55.622%; width:25.186%; height:16.029%;">
        <!-- split into two layers so only the shoulders-up part moves on
             click (see #figureWomanHead's .settle animation in style.css)
             while the lower body stays perfectly still -- the base layer
             is the FULL woman image (not just the lower-body crop), so
             the head layer moving never has any chance of revealing a
             gap no matter how far it shifts; the head crop on top simply
             covers/replaces the same region of the full image at rest. -->
        <img class="figure-layer figure-layer--body" src="assets/woman-full.png" alt="" style="left:0%; top:0%; width:98.734%; height:100%;">
        <img class="figure-layer figure-layer--head" id="figureWomanHead" src="assets/woman-head.png" alt="담요를 두르고 모닥불을 바라보며 침대에 걸터앉은 여성" style="left:39.662%; top:0%; width:52.321%; height:76.119%;">
      </div>

      <div class="ambient-flicker" aria-hidden="true"></div>
      <div class="water-shimmer" aria-hidden="true"></div>
      <div class="city-lights" id="cityLights" aria-hidden="true"></div>
      <div class="puddle-stars" id="puddleStars" aria-hidden="true"></div>
      <div class="fire-glow" aria-hidden="true"></div>
      <div class="fire-embers" id="fireEmbers" aria-hidden="true"></div>
      <div class="pipe-drip pipe-drip--a" id="pipeDripA" aria-hidden="true">
        <span class="pipe-drop"></span>
        <span class="pipe-drop pipe-drop--b"></span>
      </div>
      <div class="pipe-drip pipe-drip--b" id="pipeDripB" aria-hidden="true">
        <span class="pipe-drop pipe-drop--c"></span>
        <span class="pipe-drop pipe-drop--d"></span>
      </div>
      <div class="fireflies" id="fireflies" aria-hidden="true"></div>
      <div class="milestone-glow" id="milestoneGlow" aria-hidden="true"></div>
      <div class="milestone-particles" id="milestoneParticles" aria-hidden="true"></div>

      <!-- wall frame: the wooden picture frame + chalkboard on the right
           wall is baked directly into scene.png. No text overlay here --
           the user draws the caption text directly into the background
           art themselves. -->

      <!-- fx containers: sized/positioned to match each generated GIF's crop exactly.
           JS injects a fresh <img> into these on click and removes it when the clip ends. -->
      <div class="fx fx--fire"    id="fxFire"    style="left:53.135%; top:52.632%; width:27.63%;  height:16.148%;" aria-hidden="true"></div>
      <div class="fx fx--bed"     id="fxBed"     style="left:46.759%; top:63.397%; width:52.604%; height:18.84%;"  aria-hidden="true"></div>
      <div class="fx fx--night"   id="fxNight"   style="left:2.125%;  top:22.727%; width:38.789%; height:34.39%;"  aria-hidden="true"></div>
      <div class="fx fx--puddle"  id="fxPuddle"  style="left:10.627%; top:74.761%; width:35.069%; height:20.933%;" aria-hidden="true"></div>
      <div class="fx fx--lantern" id="fxLantern" style="left:57.917%; top:40.67%;  width:11.158%; height:8.074%;"  aria-hidden="true"></div>
      <div class="fx fx--tarp"    id="fxTarp"    style="left:37.194%; top:43.361%; width:12.221%; height:10.766%;" aria-hidden="true"></div>
      <div class="fx fx--dog"     id="fxDog"     style="left:12.115%; top:53.4%; width:16.259%; height:11.7819%;"  aria-hidden="true"></div>

      <!-- hotspots (ordered so small overlaps resolve toward the more specific target:
           tarp over night's sky area; fire over bed's near edge) -->
      <button class="hotspot hotspot--bed"     style="left:46.759%; top:63.397%; width:52.604%; height:18.84%;"  data-target="bed"     aria-label="침대">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--night"   style="left:2.125%;  top:22.727%; width:38.789%; height:34.39%;" data-target="night"   aria-label="밤하늘">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--tarp"    style="left:37.194%; top:43.361%; width:12.221%; height:10.766%;" data-target="tarp"    aria-label="천막 자락">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--fire"    style="left:53.135%; top:52.632%; width:27.63%;  height:16.148%;" data-target="fire"    aria-label="모닥불">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--puddle"  style="left:10.627%; top:74.761%; width:35.069%; height:20.933%;" data-target="puddle"  aria-label="물웅덩이">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--lantern" style="left:57.917%; top:40.67%;  width:11.158%; height:8.074%;"  data-target="lantern" aria-label="랜턴">
        <span class="hotspot-dot"></span>
      </button>
      <button class="hotspot hotspot--dog"     style="left:12.115%; top:55.323%; width:16.259%; height:9.868%;"  data-target="dog"     aria-label="쿤이">
        <span class="hotspot-dot"></span>
      </button>
    </div>
    </div>

    <p id="caption" class="caption" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <p>모닥불 · 침대 · 밤하늘 · 물웅덩이 · 랜턴 · 천막 자락 · 쿤이 — 일곱 곳을 모두 눌러보세요.</p>
  </footer>

  <script src="script.js?v=20260830-16"></script>
</body>
</html>
